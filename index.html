<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Daily Habits</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-daily.png" />
  <link rel="apple-touch-icon" href="appletouchicon.png" />
  <link rel="manifest" href="manifest.json" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Daily" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />

  <meta property="og:title" content="Daily Habits" />
  <meta property="og:description" content="Daily" />
  <meta property="og:image" content="https://teenvague.github.io/daily/mediacard-daily.png" />
  <meta property="og:url" content="https://teenvague.github.io/daily/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app">
    <section class="frame" aria-label="Habit tracker">
      <div class="scroller" id="scroller">
        <div class="track">
          <div class="months" id="months" aria-hidden="true"></div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span class="meta" id="meta">Today · 0 / 8</span>
      <button class="today-button" id="todayButton" type="button">Today</button>
    </footer>

    <div class="sr-only" id="live" aria-live="polite"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
